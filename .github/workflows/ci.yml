name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  analyze_and_test:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # DummyJSON doesn't need secrets, but the project targets Android —
      # without native platform folders `flutter analyze`/`build` fail on
      # a fresh checkout (they're gitignored on purpose).
      - name: Create Android platform folder
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Auto-formats instead of failing the build: on a phone-only Termux
      # workflow there is no local `dart format` to run before pushing,
      # so CI normalizes style here rather than blocking on it.
      - name: Apply formatting
        run: dart format .

      - name: Analyze (fatal on warnings and infos)
        run: flutter analyze --fatal-infos

      - name: Run unit & widget tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  build_apk:
    name: Build demo APK
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Create Android platform folder
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK to techmarket_pro1
        run: |
          mkdir -p build/app/outputs/flutter-apk/renamed
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/renamed/techmarket_pro1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: techmarket_pro1-release-apk
          path: build/app/outputs/flutter-apk/renamed/techmarket_pro1.apk
